<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="/css/account-setup.css" />
        <title>Mintable Teller account setup</title>
    </head>
    <body>
        <div id="container">
            <img id="logo" src="/img/icon.png" alt="Mintable Logo" />
            <h1>Mintable</h1>
            <h2>Teller Account Setup</h2>
            <p id="environment"></p>
            <p id="status" role="status"></p>
            <section>
                <h3>Current accounts</h3>
                <div id="accounts-table"></div>
            </section>
            <section id="add-accounts" hidden>
                <h3>Accounts available to add</h3>
                <div id="add-accounts-table"></div>
            </section>
            <button id="link-button" type="button">Link a new institution</button>
            <button id="done-button" type="button">Done linking accounts</button>
            <button id="cancel-button" type="button">Cancel setup</button>
            <p>Removing an account only removes it from Mintable. It does not revoke access at Teller.</p>
        </div>
        <script src="https://cdn.teller.io/connect/connect.js"></script>
        <script src="/account-setup.js"></script>
    </body>
</html>
